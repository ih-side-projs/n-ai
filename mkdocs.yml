site_name: nai (N-AI)
site_description: Local-first, spec-to-code system powered by locally served LLMs
site_url: https://github.com/ih-side-projs/n-ai
repo_url: https://github.com/ih-side-projs/n-ai
repo_name: ih-side-projs/n-ai
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - Guides:
      - Architecture: architecture.md
      - Configuration: configuration.md
      - CLI reference: cli-reference.md
      - API reference: api-reference.md
      - Workflow phases: workflow-phases.md
      - Service / daemon: service.md
      - Testing: testing.md
  - Subsystems:
      - Overview: subsystems/index.md
      - Core: subsystems/core.md
      - Store: subsystems/store.md
      - Scheduler: subsystems/scheduler.md
      - Spec pipeline: subsystems/spec-pipeline.md
      - Build pipeline: subsystems/build-pipeline.md
      - Tools: subsystems/tools.md
      - Web: subsystems/web.md
      - Evaluation: subsystems/evaluation.md
      - Languages: subsystems/languages.md
      - Execution: subsystems/execution.md
  - Reference:
      - Overall specification: specification.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
