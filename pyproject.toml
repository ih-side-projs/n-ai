[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nai"
version = "2.0.0.dev0"
description = "nai (N-AI): local-first spec-to-code system with web interface and evaluation harness"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "tomli>=2; python_version < '3.11'",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "mistune>=3.0",
    "bleach>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
web = []  # web dependencies are core; retained for CLI compatibility
tools = []
eval = ["pydantic>=2.0"]
# Optional tool families
markdown = ["markdown>=3.5"]
excel = ["openpyxl>=3.1"]
word = ["python-docx>=1.1"]
pdf = ["pypdf>=3.0", "reportlab>=4.0"]
charts = ["matplotlib>=3.7"]

[project.scripts]
nai = "nai.cli:main"
nai-web = "nai.web.server:main"
nai-mcp = "nai.tools.cli:mcp_main"
nai-bench = "nai.eval.cli:bench_main"
nai-service = "nai.service.cli:service_main"
nai-doctor = "nai.doctor:main"
nai-worker = "nai.remote.worker:worker_main"

[tool.setuptools.packages.find]
include = ["nai*"]

[tool.setuptools.package-data]
"nai" = ["py.typed"]
"nai.prompts" = ["*.txt"]
"nai.web.templates" = ["*.html"]
"nai.web.static" = ["*.css", "*.js"]
"nai.spec.prompts" = ["*.txt"]
"nai.spec" = ["schemas/*.json"]
"nai.build" = ["prompts/*.txt"]
"nai.store" = ["migrations/*.sql"]
"nai.langs.knowledge" = ["*/*.md"]
"nai.langs.vendor" = ["*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "E501",   # long lines are acceptable for readability in this codebase
    "B017",   # tests sometimes need broad exception assertions
]